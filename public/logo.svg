<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#logoGrad)" filter="url(#shadow)" />

  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="white" stroke-width="1.5" opacity="0.15" />

  <!-- Airplane icon (centered, larger) -->
  <g transform="translate(256, 240) scale(8) rotate(-30)">
    <path d="M-12 0 L-4 -2 L0 -12 L2 -12 L0 -2 L8 -4 L8 -8 L10 -8 L10 -3 L14 -4 L14 -2 L10 0 L14 2 L14 4 L10 3 L10 8 L8 8 L8 4 L0 2 L2 12 L0 12 L-4 2 L-12 0 Z" fill="white" />
  </g>

  <!-- Subtle arc path below airplane suggesting a flight route -->
  <path d="M 120 340 Q 256 280 392 340" stroke="white" stroke-width="2.5" fill="none" opacity="0.3" stroke-dasharray="8 4" />

  <!-- Small departure dot -->
  <circle cx="120" cy="340" r="5" fill="white" opacity="0.3" />
  <!-- Small arrival dot -->
  <circle cx="392" cy="340" r="5" fill="white" opacity="0.3" />
</svg>
