<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle decorative arc (great circle route) -->
  <path d="M 100 450 Q 600 150 1100 400" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.25" stroke-dasharray="12 6" />
  <path d="M 150 480 Q 600 200 1050 430" stroke="#93c5fd" stroke-width="1" fill="none" opacity="0.15" />

  <!-- Decorative dots (airports) -->
  <circle cx="100" cy="450" r="6" fill="#60a5fa" opacity="0.4" />
  <circle cx="1100" cy="400" r="6" fill="#60a5fa" opacity="0.4" />

  <!-- Airplane icon -->
  <g transform="translate(600, 200) scale(3.5)" opacity="0.95">
    <path d="M12 2L4 12h3l-2 8 12-12h-3l2-8z" fill="none" stroke="white" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="0" />
    <!-- Airplane silhouette -->
    <path d="M-12 0 L-4 -2 L0 -12 L2 -12 L0 -2 L8 -4 L8 -8 L10 -8 L10 -3 L14 -4 L14 -2 L10 0 L14 2 L14 4 L10 3 L10 8 L8 8 L8 4 L0 2 L2 12 L0 12 L-4 2 L-12 0 Z" fill="white" />
  </g>

  <!-- Title text -->
  <text x="600" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-1">
    AirMilesCalc
  </text>

  <!-- Subtitle -->
  <text x="600" y="395" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#93c5fd" text-anchor="middle">
    Flight Distance Calculator
  </text>

  <!-- Bottom tagline -->
  <text x="600" y="460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#60a5fa" text-anchor="middle" opacity="0.7">
    3,000+ Airports  |  Precise Geodesic Calculations  |  CO2 Emissions
  </text>

  <!-- Bottom border accent -->
  <rect x="0" y="615" width="1200" height="15" fill="#1e3a8a" />
</svg>
